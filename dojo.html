<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ポーカー特訓道場 v2.1(モバイル最適化)</title>
<style>
  :root{
    --bg:#0f1720; --panel:#1a2532; --panel2:#223144; --line:#2e415a;
    --text:#e8eef5; --muted:#8fa3b8; --accent:#3ecf8e; --gold:#f2c14e;
    --best:#3ecf8e; --ok:#5aa9e6; --miss:#f2a05d; --blunder:#e5636c;
    --felt:#1e4d3a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{height:100%;}
  html,body{overflow-anchor:none; -webkit-text-size-adjust:100%;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
    background:var(--bg); color:var(--text); height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:640px; padding:16px 14px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  h1{font-size:1.05rem; letter-spacing:.02em;}
  h1 small{color:var(--muted); font-weight:normal; font-size:.72rem; margin-left:6px;}
  .chips{display:flex; gap:8px;}
  .chip{
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; font-size:.8rem; display:flex; align-items:center; gap:6px;
  }
  .chip b{color:var(--gold);}
  .chip .streak-b{color:var(--accent);}
  nav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .cat{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:6px 12px; font-size:.78rem; cursor:pointer;
  }
  .cat.active{background:var(--accent); color:#08281a; border-color:var(--accent); font-weight:bold;}
  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .qmeta{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
  .tag{font-size:.7rem; padding:3px 9px; border-radius:6px; background:var(--panel2); color:var(--muted); border:1px solid var(--line);}
  .tag.review{color:var(--gold); border-color:var(--gold);}
  .stars{color:var(--gold); font-size:.75rem; letter-spacing:2px;}
  .qtitle{font-size:.95rem; font-weight:bold; margin-bottom:8px;}
  .situ{
    background:var(--felt); border-radius:10px; padding:12px 14px; margin-bottom:12px;
    font-size:.86rem; line-height:1.75;
  }
  .situ .lbl{color:#a8d5be; font-size:.72rem;}
  .cards-row{display:flex; align-items:center; gap:12px; margin:10px 0 4px; flex-wrap:wrap;}
  .cards-lbl{font-size:.78rem; color:#f2c14e; min-width:5.5em; font-weight:bold;}
  .srow{display:flex; gap:4px; align-items:baseline;}
  .slbl{color:#f2c14e; font-size:.78rem; font-weight:bold; flex-shrink:0;}
  .card{
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
    width:42px; height:58px; border-radius:6px; background:#f7f7f2; margin-right:4px;
    font-weight:bold; font-size:1.05rem; line-height:1.1; box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .card .suit{font-size:.95rem;}
  .suit-s{color:#1b1b1b;} .suit-h{color:#d0342c;} .suit-d{color:#2065c9;} .suit-c{color:#1e7d3c;}
  .noboard{color:#a8d5be; font-size:.8rem; font-style:italic;}
  .qask{font-size:.9rem; font-weight:bold; margin:12px 0 10px; color:var(--gold);}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:.92rem; cursor:pointer; text-align:left;
    transition:transform .05s;
  }
  .opt:hover{border-color:var(--accent);}
  .opt:active{transform:scale(.985);}
  .opt.revealed{cursor:default; opacity:.55;}
  .opt.g-best.revealed{border-color:var(--best); opacity:1;}
  .opt.g-ok.revealed{border-color:var(--ok);}
  .opt.picked{outline:2px solid var(--gold); opacity:1;}
  .opt .g-label{float:right; font-size:.75rem; font-weight:bold;}
  .g-best .g-label{color:var(--best);} .g-ok .g-label{color:var(--ok);}
  .g-miss .g-label{color:var(--miss);} .g-blunder .g-label{color:var(--blunder);}
  .fb{display:none; margin-top:14px;}
  .fb.show{display:block; animation:pop .18s ease-out;}
  @keyframes pop{from{transform:translateY(6px); opacity:0;} to{transform:none; opacity:1;}}
  .fb-banner{border-radius:10px; padding:10px 14px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .fb-banner.b-best{background:rgba(62,207,142,.15); color:var(--best); border:1px solid var(--best);}
  .fb-banner.b-ok{background:rgba(90,169,230,.15); color:var(--ok); border:1px solid var(--ok);}
  .fb-banner.b-miss{background:rgba(242,160,93,.15); color:var(--miss); border:1px solid var(--miss);}
  .fb-banner.b-blunder{background:rgba(229,99,108,.15); color:var(--blunder); border:1px solid var(--blunder);}
  .fb-exp{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:.85rem; line-height:1.8; margin-bottom:10px;}
  .fb-pr{
    border-left:3px solid var(--gold); background:rgba(242,193,78,.08);
    padding:9px 12px; font-size:.82rem; border-radius:0 8px 8px 0; margin-bottom:12px; color:#f5dfa8;
  }
  .fb-pr b{color:var(--gold);}
  .nextbtn{
    width:100%; background:var(--accent); color:#08281a; font-weight:bold; font-size:.95rem;
    border:none; border-radius:10px; padding:13px; cursor:pointer;
  }
  .nextbtn:hover{filter:brightness(1.08);}
  .stats{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .stats h2{font-size:.85rem; color:var(--muted); margin-bottom:12px;}
  .rank-line{display:flex; align-items:baseline; gap:10px; margin-bottom:14px;}
  .rank-title{font-size:1.15rem; font-weight:bold; color:var(--gold);}
  .rank-sub{font-size:.75rem; color:var(--muted);}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:.78rem;}
  .bar-row .bl{width:120px; color:var(--muted);}
  .bar{flex:1; height:8px; background:var(--panel2); border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:99px; width:0%;}
  .bar-row .bn{width:52px; text-align:right; color:var(--muted);}
  .counts{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .cnt{font-size:.72rem; padding:4px 10px; border-radius:6px; background:var(--panel2);}
  .cnt.c-best{color:var(--best);} .cnt.c-ok{color:var(--ok);}
  .cnt.c-miss{color:var(--miss);} .cnt.c-blunder{color:var(--blunder);}
  footer{margin-top:16px; font-size:.7rem; color:var(--muted); line-height:1.7;}
  .fb-tip{background:rgba(62,207,142,.08); border:1px solid rgba(62,207,142,.45); border-radius:10px; padding:10px 14px; font-size:.85rem; line-height:1.7; margin-bottom:10px;}
  .fb-tip b{color:var(--best);}
  .fb-learn{background:rgba(90,169,230,.08); border:1px solid rgba(90,169,230,.45); border-radius:10px; padding:11px 14px; font-size:.84rem; line-height:1.85; margin-bottom:10px;}
  .fb-learn b{color:var(--ok);}
  .q-gloss{background:rgba(90,169,230,.06); border:1px solid var(--line); border-radius:10px; padding:2px 14px; font-size:.76rem; line-height:1.75; color:var(--muted); margin:12px 0;}
  .q-gloss summary{cursor:pointer; padding:8px 0; color:var(--gold); font-size:.78rem; font-weight:bold; list-style:none;}
  .q-gloss summary::before{content:"▸ ";}
  .q-gloss[open] summary::before{content:"▾ ";}
  .q-gloss .qg-body{padding-bottom:10px; max-height:190px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .q-gloss .fg-item{margin-top:4px;}
  .q-gloss b{color:var(--accent);}
  .rgrid{display:grid; grid-template-columns:repeat(13,1fr); gap:2px; margin-top:10px;}
  .rc{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:.53rem; border-radius:3px; background:var(--panel2); color:var(--muted); overflow:hidden;}
  .rc.on{background:var(--accent); color:#08281a; font-weight:bold;}
  .rc.pair{border:1px solid var(--line);}
  .k-wrap{margin-bottom:12px;}
  .kt-title{font-size:.78rem; color:var(--gold); font-weight:bold; margin:8px 0 6px;}
  .ktbl{width:100%; border-collapse:collapse; font-size:.76rem; line-height:1.5;}
  .ktbl th,.ktbl td{border:1px solid var(--line); padding:5px 8px; text-align:left;}
  .ktbl th{color:var(--gold); background:var(--panel2); font-weight:bold;}
  .ktbl td{color:var(--muted);}

  /* ===== モバイルファースト固定画面シェル ===== */
  html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
  body{display:block;}
  .app{height:100vh; height:100dvh; max-width:640px; margin:0 auto;
    display:flex; flex-direction:column; padding:10px 12px 0;}
  header{margin-bottom:8px; flex:0 0 auto;}
  h1{font-size:.95rem;}
  nav{flex:0 0 auto; margin-bottom:8px;}
  #content{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:10px; overflow-anchor:none;}
  #abar{flex:0 0 auto; border-top:1px solid var(--line); background:var(--bg);
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; max-height:44vh; overflow-y:auto;}
  .abar-note{font-size:.78rem; color:var(--gold); font-weight:bold;}
  #abar.answered .opt{padding:7px 12px; font-size:.8rem;}
  .opts-grid2{display:flex; gap:8px;}
  .opts-grid2 .opt{flex:1; text-align:center;}
  .opt.correct.revealed{border-color:var(--best); opacity:1; background:rgba(62,207,142,.12);}
  .opt.pickedwrong{border-color:var(--blunder); opacity:1; background:rgba(229,99,108,.12);}
  .vs-lbl{color:#a8d5be; font-size:.85rem; font-weight:bold; margin:0 4px;}
  .spot-sel{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .rnote{font-size:.72rem; color:var(--muted); line-height:1.7; margin-top:12px;}
  .rdesc{font-size:.84rem; line-height:1.7; background:var(--felt); border-radius:10px; padding:12px 14px; margin-bottom:4px;}
  .qtext{font-size:.95rem; font-weight:bold; line-height:1.8; margin-bottom:14px; white-space:pre-line; background:var(--felt); border-radius:10px; padding:14px 16px;}
  .fb-inject{border:1px dashed var(--gold); color:var(--gold); border-radius:10px; padding:9px 12px; font-size:.8rem; margin-bottom:12px;}
  .stats{margin-top:0;}
  .fader-row{display:flex; align-items:center; gap:10px; margin:10px 0 4px;}
  .fader{flex:1; accent-color:var(--accent); height:28px;}
  .fader-lbl{font-size:.78rem; color:var(--muted); flex-shrink:0;}
  .fader-val{min-width:64px; text-align:right; color:var(--gold); font-weight:bold; font-size:.85rem;}

  /* ===== デスクトップ(幅700px+):下部固定を解除して自然なフローに ===== */
  @media (min-width: 700px){
    html,body{overflow:auto; height:auto;}
    .app{height:auto; min-height:100vh;}
    #content{flex:0 0 auto; overflow-y:visible;}
    #abar{max-height:none; overflow-y:visible; position:static; padding-bottom:24px;}
  }

  /* ===== スマホ:回答バーの高さ拡大+選択肢のコンパクト化(3択以上対策) ===== */
  @media (max-width: 699px){
    #abar{max-height:calc(100vh - 230px); max-height:calc(100dvh - 230px); gap:6px; overscroll-behavior:contain;}
    #abar.answered .abar-note{display:none;}
    #abar .opt{padding:9px 12px; font-size:.85rem; line-height:1.5;}
    .abar-note{font-size:.72rem;}
    #abar .nextbtn{padding:11px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>♠ ポーカー特訓道場<small>知識×判断 v2.1</small></h1>
    <div class="chips">
      <div class="chip">レート <b id="rating">1200</b></div>
      <div class="chip">XP <b id="xp">0</b></div>
      <div class="chip">連続 <b class="streak-b" id="streak">0</b></div>
    </div>
  </header>
  <nav id="catnav"></nav>
  <main id="content"></main>
  <div id="abar"></div>
</div>

<script>
// ===== 問題バンク =====
// grade: best(最善) / ok(許容) / miss(ミス) / blunder(大ミス)
const CATS = {
  odds:  "オッズ&アウツ",
  open:  "オープンレンジ",
  push:  "プッシュ/フォールド",
  icm:   "ICM&バブル"
};

const SCENARIOS = [
// ---------- オッズ&アウツ ----------
{
  cat:"odds", level:1, title:"フラッシュドロー vs ポットベット",
  situ:["トーナメント中盤、6人テーブル。", "ターン。ポット 6,000。相手が 6,000(ポットサイズ)をベット。", "あなたはフラッシュドロー(あと1枚でフラッシュ完成)。"],
  hero:["Ah","9h"], board:["Kh","7h","2s","Jd"],
  opts:[
    {label:"フォールド", grade:"best", note:"オッズに合わない"},
    {label:"コール", grade:"miss", note:"必要勝率に届かない"},
    {label:"オールイン", grade:"blunder", note:"根拠のないブラフ化"}
  ],
  exp:"コールに必要な勝率 = 6,000 ÷ (6,000+6,000+6,000) = 33.3%。フラッシュのアウツは9枚で、リバー1枚で引ける確率は 9/46 ≈ 19.6%。33.3%に大きく届かないのでフォールドが最善です。相手のスタックが深く、引けたら大きく回収できる(インプライドオッズ)場合のみコールが正当化されますが、ポットサイズベットに対しては通常足りません。",
  pr:"必要勝率 = コール額 ÷ (ポット+ベット+コール額)。ドローの勝率がこれを下回るならフォールド。"
},
{
  cat:"odds", level:1, title:"オープンエンド vs 小さいベット",
  situ:["トーナメント序盤、9人テーブル。", "フロップ。ポット 4,000。相手が 1,000(1/4ポット)をベット。", "あなたはオープンエンドストレートドロー(8アウツ)。"],
  hero:["Ts","9s"], board:["8d","7c","2h"],
  opts:[
    {label:"コール", grade:"best", note:"オッズが十分"},
    {label:"レイズ(セミブラフ)", grade:"ok", note:"戦略としては有効"},
    {label:"フォールド", grade:"miss", note:"好オッズを捨てている"}
  ],
  exp:"必要勝率 = 1,000 ÷ (4,000+1,000+1,000) ≈ 16.7%。8アウツはターン1枚だけでも 8/47 ≈ 17% あり、引けた場合の追加回収(インプライドオッズ)を考えれば明確なコールです。セミブラフレイズも「今降ろして勝つ+引いて勝つ」の2つの勝ち筋があり許容ですが、基本はコールで十分。フォールドだけが明確な間違いです。",
  pr:"小さいベットに対して良いドローは基本降りない。1/4ポットのベットに必要な勝率は約17%しかない。"
},
{
  cat:"odds", level:1, title:"AAでのプリフロップ判断",
  situ:["トーナメント序盤。相手が先にオールイン(あなたのスタックをカバー)。", "あなたの手札は AA。"],
  hero:["As","Ad"], board:[],
  opts:[
    {label:"コール", grade:"best", note:"常に正解"},
    {label:"フォールド", grade:"blunder", note:"最強の手を捨てる"}
  ],
  exp:"AAはプリフロップ最強で、ランダムハンド相手に約85%、相手が最強クラスのKKでも約81%の勝率があります。プリフロップでAAがオールインに対して降りる状況は(特殊なサテライト等を除き)存在しません。「大事に行き過ぎて降りる」のはトーナメント初心者の典型的な大ミスです。",
  pr:"AAのプリフロップオールインコールは思考不要。例外は後で学ぶサテライトのICM極限のみ。"
},
{
  cat:"odds", level:2, title:"ガットショット vs 2/3ポット",
  situ:["トーナメント中盤。ターン。ポット 9,000。相手が 6,000(2/3ポット)をベット。", "あなたはガットショット(中抜きストレート、4アウツ)のみ。"],
  hero:["Jc","Tc"], board:["8s","Qd","3h","2c"],
  opts:[
    {label:"フォールド", grade:"best", note:"オッズが全く合わない"},
    {label:"コール", grade:"miss", note:"約9%で29%のコールをしている"},
    {label:"レイズ(ブラフ)", grade:"blunder", note:"根拠のない大きなリスク"}
  ],
  exp:"必要勝率 = 6,000 ÷ (9,000+6,000+6,000) ≈ 28.6%。ガットショットはリバー1枚で 4/46 ≈ 8.7% しかなく、3倍以上足りません。この差はインプライドオッズでは埋まりません。またこのボードでのブラフレイズは、相手のレンジや自分のブロッカーの裏付けがない限り単なる浪費です。",
  pr:"4アウツは約9%。ガットショット単体は小さいベット以外ほぼ全部フォールド。"
},
{
  cat:"odds", level:2, title:"コンボドロー vs オールイン",
  situ:["トーナメント中盤。フロップ。ポット 5,000。相手が 5,000をオールイン。", "あなたはフラッシュドロー+オープンエンド(15アウツ)。"],
  hero:["Th","9h"], board:["8h","7h","2c"],
  opts:[
    {label:"コール", grade:"best", note:"実はあなたが有利"},
    {label:"フォールド", grade:"miss", note:"勝率54%を捨てている"}
  ],
  exp:"フラッシュ9アウツ+ストレート8アウツ−重複2枚 = 15アウツ。残り2枚で引ける確率は約54%で、相手がすでにワンペアでもあなたが「有利」です。必要勝率は 5,000 ÷ 15,000 = 33.3% なので大幅に上回ります。強いコンボドローは「まだ何もできていない」ように見えて、実質モンスターハンドです。",
  pr:"15アウツ2枚 ≈ 54%。強いコンボドローはフロップでは実質ナッツ級として扱う。"
},
{
  cat:"odds", level:3, title:"ペアボードでのドロー(アウツの割引)",
  situ:["トーナメント中盤。ターン。ポット 8,000。相手が 8,000(ポットサイズ)をベット。", "ボードはペアボード。あなたはフラッシュドロー(名目9アウツ)。"],
  hero:["Qd","Jd"], board:["Ks","Kd","7d","3c"],
  opts:[
    {label:"フォールド", grade:"best", note:"割引後のアウツでは全く足りない"},
    {label:"コール", grade:"miss", note:"名目アウツを鵜呑みにしている"}
  ],
  exp:"必要勝率は33.3%、名目のフラッシュ確率は約19.6%でそもそも足りませんが、さらに重要なのは「ペアボードではアウツを割引する」ことです。相手がトリップスやフルハウスなら、フラッシュを引いても負けます(リバーでボードがもう一度ペアになればフルハウスに逆転される)。実効アウツは9枚より確実に少なく、実質15%前後。二重に足りません。",
  pr:"ペアボードではフラッシュ/ストレートのアウツを割り引く。「引いても負ける」アウツは数えない。"
},

// ---------- オープンレンジ ----------
{
  cat:"open", level:1, title:"UTGのA5オフスート",
  situ:["トーナメント序盤、9人テーブル、スタック60bb。", "あなたはUTG(最初に行動する席)。全員まだアクションしていません。"],
  hero:["Ah","5c"], board:[],
  opts:[
    {label:"フォールド", grade:"best", note:"最初の席では弱すぎる"},
    {label:"レイズ(2.2bb)", grade:"miss", note:"後ろに8人いる席では損"},
    {label:"リンプ(コールで参加)", grade:"blunder", note:"リンプは原則禁止"}
  ],
  exp:"エースでも、キッカー(2枚目)が弱いオフスートのエースはUTGでは明確なフォールドです。後ろに8人おり、誰かがより強いエース(AK〜A9)を持っている確率が高く、エースが当たっても「勝っているか分からないトップペア」になりがちです(逆ドミネーション)。またリンプはほぼ全ての状況で「レイズかフォールドか」に劣ります。",
  pr:"ポジションが早いほどタイトに。A2o〜A8oはUTGでは全部フォールドが基本形。"
},

}

// ===== 表形式ナレッジ(解答後に正誤問わず表示) =====
const RANKS=[..."AKQJT98765432"];
function expandRange(str){
  const set=new Set();
  const ri=r=>RANKS.indexOf(r);
  for(let tok of str.split(",").map(s=>s.trim()).filter(Boolean)){
    const plus=tok.endsWith("+"); if(plus)tok=tok.slice(0,-1);
    if(tok.length===2&&tok[0]===tok[1]){
      if(plus){for(let j=ri(tok[0]);j>=0;j--)set.add(RANKS[j]+RANKS[j]);}
      else set.add(tok);
    }else{
      const a=tok[0],b=tok[1],suf=tok[2];
      const sufs=suf?[suf]:["s","o"];
      for(const s of sufs){
        if(plus){for(let j=ri(b);j>ri(a);j--)set.add(a+RANKS[j]+s);}
        else set.add(a+b+s);
      }
    }
  }
  return set;
}

function rangeGridHTML(id){
  const spot=RANGES[id]; const set=expandRange(spot.r);
  let combos=0; set.forEach(h=>{combos+=h.length===2?6:(h[2]==="s"?4:12);});
  const pct=Math.round(100*combos/1326);
  let cells="";
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){
    let key;
    if(i===j) key=RANKS[i]+RANKS[j];
    else if(i<j) key=RANKS[i]+RANKS[j]+"s";
    else key=RANKS[j]+RANKS[i]+"o";
    cells+=`<span class="rc ${i===j?"pair":""} ${set.has(key)?"on":""}">${key}</span>`;
  }
  return `<div class="kt-title">📊 ${spot.label} ${spot.action||"プッシュ"}レンジ目安(緑=${spot.action||"プッシュ"}、全体の約${pct}%)</div><div class="rgrid">${cells}</div>`;
}

}

function detectSpot(text){
  if(/【ポジション】BB|【BB】|BBのコール/.test(text)) return "bbcall";
  if(/SB/.test(text)) return /5bb/.test(text) ? "sb5" : "sb10";
  if(/ボタン|BTN/.test(text)) return "btn10";
  if(/UTG/.test(text)) return "utg10";
  if(/HJ/.test(text)) return "hj10";
  if(/CO/.test(text)) return "co10";
  return null;
}
function knowledgeHTML(text, kind){
  const parts=[];
  if(kind==="nash"||kind==="push"){
    const s=detectSpot(text);
    if(s) parts.push(rangeGridHTML(s));
  }else{
    if(/バブル|サテライト|ペイジャンプ/.test(text)) parts.push(KT.bubble());
    if(/アウツ|ドロー/.test(text)) parts.push(KT.outs());
    if(/必要勝率|必要な勝率|ポットオッズ/.test(text)) parts.push(KT.req());
    if(/ブラフ|MDF/.test(text)) parts.push(KT.bluff());
    if(/[AKQJT98765432]{2}[os]? vs /.test(text)) parts.push(KT.match());
    if(kind==="open") parts.push(KT.open());
  }
  return parts.slice(0,2).map(p=>`<div class="k-wrap">${p}</div>`).join("");
}

// ===== レンジ表からのプッシュ/フォールド問題 自動生成 =====
// 各スポットの「余裕で範囲内」「余裕で範囲外」のハンドだけを問題化(境界ぎりぎりは除外)
(function generatePushQuestions(){
  const SUITSETS=[["s","h"],["h","d"],["d","c"],["c","s"]];
  const handToCards=(h,seed)=>{
    const set=SUITSETS[seed%4];
    if(h.length===2) return [h[0]+set[0], h[1]+set[1]];
    if(h[2]==="s")  return [h[0]+set[1], h[1]+set[1]];
    return [h[0]+set[0], h[1]+set[1]];
  };
  const weaker=h=>{
    if(h.length===2){const r=RANKS.indexOf(h[0]); return r<12? RANKS[r+1]+RANKS[r+1] : null;}
    const rb=RANKS.indexOf(h[1]);
    if(rb>=12) return null;
    const nb=RANKS[rb+1];
    return nb===h[0] ? null : h[0]+nb+h[2];
  };
  const stronger=h=>{
    if(h.length===2){const r=RANKS.indexOf(h[0]); return r>0? RANKS[r-1]+RANKS[r-1] : null;}
    const rb=RANKS.indexOf(h[1]), ra=RANKS.indexOf(h[0]);
    return (rb-1<=ra) ? null : h[0]+RANKS[rb-1]+h[2];
  };
  const pickEvenly=(arr,n)=>{
    if(!arr.length || n<=0) return [];
    if(arr.length<=n) return arr.slice();
    if(n===1) return [arr[Math.floor(arr.length/2)]];
    const out=[];
    for(let k=0;k<n;k++) out.push(arr[Math.floor(k*(arr.length-1)/(n-1))]);
    return [...new Set(out)];
  };
  const allHands=[];
  for(let i=0;i<13;i++)for(let j=0;j<13;j++)
    allHands.push(i===j? RANKS[i]+RANKS[j] : (i<j? RANKS[i]+RANKS[j]+"s" : RANKS[j]+RANKS[i]+"o"));

  const SPOTS=[
    {id:"utg10", pos:"UTG", pl:"9人", stk:"10bb", act:"あなたが最初のアクション(前に誰も参加していない)"},
    {id:"hj10",  pos:"HJ",  pl:"9人", stk:"10bb"},
    {id:"co10",  pos:"CO",  pl:"9人", stk:"10bb"},
    {id:"btn10", pos:"BTN(ボタン)", pl:"8人", stk:"10bb"},
    {id:"sb10",  pos:"SB",  pl:"8人", stk:"10bb"},
    {id:"sb5",   pos:"SB",  pl:"8人", stk:"5bb"},
    {id:"bbcall",pos:"BB",  pl:"8人", stk:"12bb(相手をカバー)"}
  ];
  let seed=0;
  for(const sp of SPOTS){
    const spot=RANGES[sp.id];
    const set=expandRange(spot.r);
    let combos=0; set.forEach(h=>{combos+=h.length===2?6:(h[2]==="s"?4:12);});
    const pct=Math.round(100*combos/1326);
    const clearIn = allHands.filter(h=>set.has(h) && (w=>w==null||set.has(w))(weaker(h)));
    const clearOut= allHands.filter(h=>!set.has(h) && (s2=>s2==null||!set.has(s2))(stronger(h)));
    // 境界ぎりぎり(キワ)のハンド:内側の縁と外側の縁
    const edgeIn  = allHands.filter(h=>set.has(h) && weaker(h)!=null && !set.has(weaker(h)));
    const edgeOut = allHands.filter(h=>!set.has(h) && stronger(h)!=null && set.has(stronger(h)));
    const isCall = sp.id==="bbcall";
    const act = isCall ? "SB(10bb・熟練者)がオールイン" : (sp.act || "全員フォールドで回ってきた");
    const doLbl = isCall ? "コール" : "オールイン";
    const make=(h,inRange)=>{
      seed++;
      const opts = inRange
        ? [{label:doLbl, grade:"best", note:"レンジ内"}, {label:"フォールド", grade:"miss", note:"レンジ内の手を捨てている"}]
        : [{label:"フォールド", grade:"best", note:"レンジ外"}, {label:doLbl, grade:"miss", note:"レンジ外の手で無理をしている"}];
      if(!isCall) opts.push({label:"リンプ", grade:"blunder", note:"浅いスタックのリンプは最悪の妥協"});
      const exp = inRange
        ? `${spot.label}の${isCall?"コール":"ナッシュプッシュ"}レンジは全体の約${pct}%で、${h} は境界に余裕をもって含まれます。${isCall?"広いプッシュレンジに対して十分に勝ち越せるためコールが正解。":"ここで遠慮することはブラインド侵食を受け入れる純粋な損失です。"}下のレンジ表で ${h} の位置(緑)を確認してください。`
        : `${h} は${spot.label}のレンジ(約${pct}%)の外側です。${isCall?"広いレンジ相手でも下位の手では勝ち越せません。コールレンジはプッシュレンジよりずっと狭いのが大原則。":"範囲外の手で押すのは、コールされた時に負けすぎるため長期的に損です。"}下のレンジ表で境界を確認してください。`;
      return {
        cat:"push", level:2, gen:true, spot:sp.id,
        title:`${spot.label}の${h}`,
        metaG:{st:"トーナメント終盤", pl:sp.pl, pos:sp.pos, stk:sp.stk, act},
        situ:[], hero:handToCards(h,seed), board:[],
        opts, exp,
        pr:"レンジはポジション(後ろの人数)とスタックで決まる。表の緑と灰の境界を反復で体に入れる。"
      };
    };
    const makeEdge=(h,leanIn)=>{
      seed++;
      const leanLbl = leanIn ? doLbl : "フォールド";
      const otherLbl = leanIn ? "フォールド" : doLbl;
      const exp = `${h} は${spot.label}レンジ(約${pct}%)のちょうど境界線上です。EV差はごく僅かで、実際のソルバー解ではこの領域は混合頻度(同じ手を押したり降りたりする)になります。傾きを決める要因は3つ:①アンティの有無(あれば押し寄り)②相手のコール傾向(タイトな相手ほど押し得)③ICM状況(バブルなら降り寄り)。この近似表では「どちらかと言えば${leanLbl}」です。`;
      return {
        cat:"push", level:3, gen:true, edge:true, spot:sp.id,
        title:`${spot.label}の${h}(境界)`,
        metaG:{st:"トーナメント終盤", pl:sp.pl, pos:sp.pos, stk:sp.stk, act},
        situ:[], hero:handToCards(h,seed), board:[],
        opts:[
          {label:leanLbl, grade:"best", note:"どちらかと言えばこちら"},
          {label:otherLbl, grade:"ok", note:"EV差は僅か。ミスではない"}
        ],
        exp,
        pr:"境界ハンドは正誤ではなく頻度の世界。「どちらに傾けるか」の要因(アンティ・相手・ICM)ごと覚える。"
      };
    };
    pickEvenly(clearIn,6).forEach(h=>SCENARIOS.push(make(h,true)));
    pickEvenly(clearOut,5).forEach(h=>SCENARIOS.push(make(h,false)));
    pickEvenly(edgeIn,2).forEach(h=>SCENARIOS.push(makeEdge(h,true)));
    pickEvenly(edgeOut,1).forEach(h=>SCENARIOS.push(makeEdge(h,false)));
  }
})();

// ===== カード画像描画 =====
const SUITS = {s:"♠", h:"♥", d:"♦", c:"♣"};
function cardHTML(cd){
  const r = cd.slice(0,-1).replace("T","10");
  const s = cd.slice(-1);
  return `<span class="card suit-${s}"><span>${r}</span><span class="suit">${SUITS[s]}</span></span>`;
}
// ハンド表記(A2o/AKs/33等)→2枚のカードへ。setは使うスート組
function handCards(n, set){
  const r1 = n[0], r2 = n[1];
  const suf = n.length>2 ? n[2] : (r1===r2 ? "" : "o");
  if(r1===r2) return [r1+set[0], r2+set[1]];
  if(suf==="s") return [r1+set[1], r2+set[1]];
  return [r1+set[0], r2+set[1]];
}
// 問題文からハンド表記を自動抽出して描画
function handVisualHTML(q){
  const HAND = "[AKQJT98765432]{2}[os]?";
  const duel = q.match(new RegExp("("+HAND+")\\s*vs\\s*("+HAND+")"));
  if(duel){
    const h1 = handCards(duel[1], ["s","h"]);
    const h2 = handCards(duel[2], ["d","c"]);
    return `<div class="cards-row">${h1.map(cardHTML).join("")}<span class="vs-lbl">vs</span>${h2.map(cardHTML).join("")}</div>`;
  }
  const single = q.match(new RegExp("(?:^|\\n)("+HAND+")\\s+(?:は|での)"));
  if(single){
    const h = handCards(single[1], ["s","h"]);
    return `<div class="cards-row">${h.map(cardHTML).join("")}</div>`;
  }
  return "";
}

function nodeOfCard(c){
  const t=c.q+c.e;
  if(c.d==="gto") return "gto";
  if(c.d==="pf") return "postflop";
  if(c.d==="early") return "early";
  if(c.d==="nash") return "nash-"+(detectSpot(t)||"sb10");
  if(c.d==="icm"){
    if(/サテライト/.test(t)) return "icm-sat";
    if(/バブル|ICM|ペイジャンプ|カバー/.test(t)) return "icm";
    return "principle";
  }
  if(/[AKQJT98765432]{2}[os]? vs /.test(t)) return "matchup";
  if(/ブラフ|MDF/.test(t)) return "bluff";
  if(/必要な勝率|必要勝率|コールに必要/.test(t)) return "odds";
  if(/アウツ|ドロー|セット|ヒット/.test(t)) return "outs";
  return "principle";
}
function nodeOfScenario(q){
  if(q.spot) return "nash-"+q.spot;
  if(q.cat==="postflop") return "postflop";
  if(q.cat==="gto") return "gto";
  if(q.cat==="early") return "early";
  if(q.cat==="bluff") return "bluff";
  if(q.cat==="tell") return "tell";
  if(q.cat==="push") return "nash-"+(detectSpot(q.title+q.situ.join(""))||"sb10");
  if(q.cat==="open") return "open";
  if(q.cat==="icm") return /サテライト/.test(q.title)?"icm-sat":"icm";
  return "odds";
}
const ITEMS=[
  ...CARDS.map(c=>({type:"know", ref:c, node:nodeOfCard(c), box:1})),
  ...SCENARIOS.map(q=>({type:"judge", ref:q, node:nodeOfScenario(q), box:1}))
];
const GROUP_LIST=[["outs","アウツ&勝率"],["odds","オッズ判断"],["bluff","ブラフ&MDF"],["matchup","マッチアップ"],["open","オープンレンジ"],["postflop","ポストフロップ"],["gto","GTO理論"],["early","序盤・ディープ"],["nash","ナッシュP/F"],["icm","ICM&バブル"],["icm-sat","サテライト"],["principle","原則"]];
const groupOf=n=>n.startsWith("nash-")?"nash":n;
const groupLabel=n=>(GROUP_LIST.find(g=>g[0]===groupOf(n))||["","その他"])[1];

const state={mode:"mix", chartSpot:"sb10", cfix:"pos", cpos:"SB", cstk:10, cview:"range", rating:1200, xp:0, streak:0, answered:0,
  counts:{best:0,ok:0,miss:0,blunder:0}, priority:[], recent:[], lastIdx:-1, current:-1, locked:false};

function mastery(node){
  const ks=ITEMS.filter(it=>it.type==="know"&&it.node===node);
  if(!ks.length) return 0.7;
  return ks.filter(it=>it.box>=3).length/ks.length;
}
function pickNext(){
  if(state.priority.length){ state.current=state.priority.shift(); return; }
  let pool=ITEMS.map((it,i)=>({it,i})).filter(x=>x.i!==state.lastIdx);
  if(state.mode==="judge") pool=pool.filter(x=>x.it.type==="judge");
  else if(state.mode==="know") pool=pool.filter(x=>x.it.type==="know");
  const ms={};
  const w=x=>{
    let base=Math.pow(2,5-x.it.box);
    if(state.recent.includes(groupOf(x.it.node))) base*=0.35;
    if(state.mode==="mix"){
      const m = ms[x.it.node]!==undefined ? ms[x.it.node] : (ms[x.it.node]=mastery(x.it.node));
      base *= x.it.type==="judge" ? (0.3+0.9*m) : (1.2-0.9*m);
    }
    return base;
  };
  const tot=pool.reduce((s,x)=>s+w(x),0);
  let r=Math.random()*tot;
  for(const x of pool){ r-=w(x); if(r<=0){ state.current=x.i; return; } }
  state.current=pool[pool.length-1].i;
}
function nextItem(){ pickNext(); const _g=groupOf(ITEMS[state.current].node); state.recent=[_g, ...state.recent].slice(0,2); state.locked=false; render(); }
function render(){
  const it=ITEMS[state.current];
  if(it.type==="judge") renderJudge(it); else renderKnow(it);
  renderChips();
  el("content").scrollTop=0;
}

// --- 判断問題 ---
function renderJudge(it){
  const q=it.ref;
  const opts=shuffle(q.opts.map(o=>({...o})));
  const m=q.metaG||META[q.title];
  const glossText=q.title+(m?Object.values(m).join(""):q.situ.join(""))+q.exp+q.pr+q.opts.map(o=>o.label).join("");
  el("content").innerHTML=`
    <div class="qmeta">
      <span class="tag">🃏 判断</span>
      <span class="tag">${groupLabel(it.node)}</span>
      <span class="stars">${"★".repeat(q.level)}${"☆".repeat(3-q.level)}</span>
      ${q.edge?'<span class="tag review">キワ(境界)</span>':""}
      <span class="tag">箱${it.box}</span>
    </div>
    <div class="qtitle">${q.title}</div>
    <div class="situ">
      ${m?`
      <div class="srow"><span class="slbl">【シチュエーション】</span>${m.st}</div>
      <div class="srow"><span class="slbl">【テーブル人数】</span>${m.pl}</div>
      <div class="srow"><span class="slbl">【ポジション】</span>${m.pos}</div>
      <div class="srow"><span class="slbl">【スタック】</span>${m.stk}</div>
      <div class="srow"><span class="slbl">【状況】</span>${m.act}</div>`
      : q.situ.map(l=>`<div>${l}</div>`).join("")}
      <div class="cards-row"><span class="cards-lbl">【ハンド】</span>${q.hero.map(cardHTML).join("")}</div>
      <div class="cards-row"><span class="cards-lbl">【ボード】</span>${q.board.length?q.board.map(cardHTML).join(""):'<span class="noboard">(プリフロップ)</span>'}</div>
    </div>
    ${glossHTML(glossText)}
    <div class="fb" id="fb"></div>`;
  const abar=el("abar");
  abar.classList.remove("answered");
  abar.innerHTML=`<div class="abar-note">▶ あなたのアクションは?</div>`+
    opts.map(o=>`<button class="opt g-${o.grade}" data-g="${o.grade}">${o.label}<span class="g-label"></span></button>`).join("");
  abar.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerJudge(b,it));
  abar.scrollTop=0;
}
function answerJudge(btn,it){
  if(state.locked)return; state.locked=true;
  const q=it.ref, g=btn.dataset.g, info=GRADE_INFO[g];
  state.answered++; state.lastIdx=state.current;
  state.rating=Math.max(800,state.rating+info.pts);
  state.counts[g]++;
  if(g==="best"){state.streak++; it.box=Math.min(5,it.box+1);}
  else if(g==="ok"){state.streak++;}
  else {state.streak=0; it.box=1;}
  let injected=0;
  if(state.mode==="mix"&&(g==="miss"||g==="blunder")){
    ITEMS.map((x,i)=>({x,i}))
      .filter(o=>o.x.type==="know"&&o.x.node===it.node&&o.x.box<4&&!state.priority.includes(o.i)&&o.i!==state.current)
      .sort((a,b)=>a.x.box-b.x.box).slice(0,2)
      .forEach(o=>{state.priority.push(o.i); injected++;});
  }
  const abar=el("abar");
  abar.classList.add("answered");
  abar.querySelectorAll(".opt").forEach(b=>{
    b.classList.add("revealed");
    b.querySelector(".g-label").textContent=GRADE_INFO[b.dataset.g].jp+(b.dataset.g==="best"?" ✓":"");
    b.onclick=null;
  });
  btn.classList.add("picked");
  abar.insertAdjacentHTML("beforeend",'<button class="nextbtn" id="nextbtn">次へ ▶</button>');
  el("nextbtn").onclick=nextItem;
  abar.scrollTop=abar.scrollHeight;
  const firstSent=q.exp.split("。")[0]+"。";
  let body;
  if(g==="best") body=`<div class="fb-tip">✓ <b>ワンポイント:</b> ${firstSent}</div><div class="fb-pr"><b>原則:</b> ${q.pr}</div>`;
  else if(g==="ok") body=`<div class="fb-exp">${q.exp}</div><div class="fb-pr"><b>原則:</b> ${q.pr}</div>`;
  else body=`<div class="fb-exp">${q.exp}</div>${LEARN[q.title]?`<div class="fb-learn"><b>🧭 思考手順:</b> ${LEARN[q.title]}</div>`:""}<div class="fb-pr"><b>原則:</b> ${q.pr}</div>`;
  const fb=el("fb");
  const sign=info.pts>0?"+":"";
  fb.innerHTML=`
    <div class="fb-banner b-${info.cls}"><span>${g==="best"?"⭐ ":""}あなたの選択:${info.jp}</span><span>${sign}${info.pts} pt</span></div>
    ${body}
    ${q.spot?`<div class="k-wrap">${rangeGridHTML(q.spot)}</div>`:knowledgeHTML(q.title+q.situ.join("")+q.exp+q.pr,q.cat)}
    ${injected?`<div class="fb-inject">📥 この分野(${groupLabel(it.node)})の前提知識カード${injected}枚を次に出題します</div>`:""}`;
  fb.classList.add("show");
  fb.scrollIntoView({behavior:"smooth",block:"start"});
  renderChips();
  saveState();
}

// --- 知識カード ---
function renderKnow(it){
  const c=it.ref;
  const opts=shuffle(c.o.map(o=>({...o})));
  el("content").innerHTML=`
    <div class="qmeta">
      <span class="tag">🧠 知識</span>
      <span class="tag">${groupLabel(it.node)}</span>
      <span class="tag">箱${it.box}${it.box>=4?" ✦":""}</span>
    </div>
    <div class="qtext">${c.q}${handVisualHTML(c.q)}</div>
    ${glossHTML(c.q+c.e+c.o.map(o=>o.t).join(""))}
    <div class="fb" id="fb"></div>`;
  const abar=el("abar");
  abar.classList.remove("answered");
  const btns=opts.map(o=>`<button class="opt ${o.ok?"correct":""}">${o.t}</button>`).join("");
  abar.innerHTML=c.two?`<div class="opts-grid2">${btns}</div>`:btns;
  abar.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerKnow(b,it));
  abar.scrollTop=0;
}
function answerKnow(btn,it){
  if(state.locked)return; state.locked=true;
  const c=it.ref;
  const good=btn.classList.contains("correct");
  state.answered++; state.lastIdx=state.current;
  let gained=0;
  if(good){state.streak++; gained=10+Math.min(state.streak,10)*2; state.xp+=gained; it.box=Math.min(5,it.box+1);}
  else {state.streak=0; it.box=1;}
  const abar=el("abar");
  abar.classList.add("answered");
  abar.querySelectorAll(".opt").forEach(b=>{b.classList.add("revealed"); b.onclick=null;});
  if(!good)btn.classList.add("pickedwrong");
  abar.insertAdjacentHTML("beforeend",'<button class="nextbtn" id="nextbtn">次へ ▶</button>');
  el("nextbtn").onclick=nextItem;
  abar.scrollTop=abar.scrollHeight;
  const fb=el("fb");
  fb.innerHTML=`
    <div class="fb-banner b-${good?"best":"blunder"}"><span>${good?"✓ 正解!":"✗ 不正解(箱1に戻ります)"}</span><span>${good?`+${gained} XP`:"—"}</span></div>
    ${good?`<div class="fb-tip">✓ <b>チェック:</b> ${c.e.split("。")[0]}。</div>`:`<div class="fb-exp">${c.e}</div>`}
    ${knowledgeHTML(c.q+" "+c.e,c.d)}`;
  fb.classList.add("show");
  fb.scrollIntoView({behavior:"smooth",block:"start"});
  renderChips();
  saveState();
}

function gridRawHTML(rangeStr, label, action){
  const set=expandRange(rangeStr);
  let combos=0; set.forEach(h=>{combos+=h.length===2?6:(h[2]==="s"?4:12);});
  const pct=Math.round(100*combos/1326);
  let cells="";
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){
    let key;
    if(i===j) key=RANKS[i]+RANKS[j];
    else if(i<j) key=RANKS[i]+RANKS[j]+"s";
    else key=RANKS[j]+RANKS[i]+"o";
    cells+=`<span class="rc ${i===j?"pair":""} ${set.has(key)?"on":""}">${key}</span>`;
  }
  return `<div class="kt-title">📊 ${label}(緑=${action}、全体の約${pct}%)</div><div class="rgrid">${cells}</div>`;
}
function chartGrid(){
  const r=RANGES2[state.cpos][state.cstk];
  const action=RANGES2[state.cpos].act||"プッシュ";
  return gridRawHTML(r, `${state.cpos} ${state.cstk}bb`, action);
}

const TABLE_VIEWS=[["range","🃏 レンジ表"],["outs","アウツ"],["req","必要勝率"],["bluff","ブラフ&MDF"],["match","マッチアップ"],["bubble","バブル方針"],["open","オープン目安"]];
const TABLE_NOTES={range:"",outs:"ドローの種類→アウツ数→勝率の対応。ルールオブ4と2(アウツ×4=2枚、×2=1枚)の実体。",req:"相手のベットサイズ→コールに必要な勝率。全コール判断の土台。",bluff:"自分のブラフの損益分岐フォールド率と、守る側の最低防御頻度(MDF)。",match:"プリフロップオールインの代表的な対決の勝率。型ごと覚える。",bubble:"バブルでのスタック別方針。同じ状況でも立場で正解が反転する。",open:"ポジション別のオープン参加率の目安(40bb+・9人)。"};
function chartTabsHTML(){
  return `<div class="spot-sel">${TABLE_VIEWS.map(([k,v])=>`<button class="cat ${state.cview===k?"active":""}" data-cv="${k}">${v}</button>`).join("")}</div>`;
}
function bindChartTabs(root){
  root.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{state.cview=b.dataset.cv; renderChartView();});
}
function renderTableView(){
  el("abar").innerHTML="";
  el("content").innerHTML=`
    <div class="qmeta"><span class="tag">早見表</span></div>
    ${chartTabsHTML()}
    <div class="rdesc">${TABLE_NOTES[state.cview]||""}</div>
    <div class="k-wrap">${KT[state.cview]()}</div>`;
  bindChartTabs(el("content"));

function renderChartView(){
  if(state.cview!=="range"){ renderTableView(); return; }
  renderRangeView();

// --- 成績 ---
function rankTitle(r){
  if(r<1100)return "見習い"; if(r<1250)return "アマチュア";
  if(r<1400)return "レギュラー"; if(r<1550)return "セミプロ"; return "クラッシャー";
}
function renderStatsView(){
  el("abar").innerHTML="";
  const bars=GROUP_LIST.map(([g,label])=>{
    const its=ITEMS.filter(it=>groupOf(it.node)===g);
    if(!its.length)return "";
    const mstr=its.filter(it=>it.box>=4).length;
    const pct=Math.round(100*mstr/its.length);
    return `<div class="bar-row"><span class="bl">${label}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="bn">${mstr}/${its.length}</span></div>`;
  }).join("");

  el("content").innerHTML=`
    <div class="stats">
      <h2>分野別マスター状況(箱4以上)</h2>
      <div class="rank-line">
        <div class="rank-title">${rankTitle(state.rating)}</div>
        <div class="rank-sub">回答数 ${state.answered}・優先キュー ${state.priority.length}</div>
      </div>
      ${bars}
      <div class="counts">
        <span class="cnt c-best">最善 ${c.best}</span><span class="cnt c-ok">許容 ${c.ok}</span>
        <span class="cnt c-miss">ミス ${c.miss}</span><span class="cnt c-blunder">大ミス ${c.blunder}</span>
      </div>
    </div>
    <footer>
      🎯 特訓(ミックス):知識カード68枚と判断問題122問が1本のキューに流れます。分野の知識習熟度が低いうちは暗記中心、上がるほど判断問題が増加。判断ミス時はその分野の前提知識カードが割り込み出題(📥)。<br>
      採点:判断=最善+15/許容+5/ミス−10/大ミス−25(レート)、知識=正解でXP+コンボ。ライトナー式(箱1〜5)。キワ問題はミス判定なし。<br>💾 進捗保存: ${CAN_SAVE?"<b>有効</b>(この端末に自動保存されます)":"この環境では無効(セッション内のみ。端末保存ファイルやホスティング版では自動で有効になります)"} ${CAN_SAVE?`<button class="cat" id="rsbtn">進捗をリセット</button>`:""}

  el("content").scrollTop=0;
}
function renderChips(){
  el("rating").textContent=state.rating;
  el("xp").textContent=state.xp;
  el("streak").textContent=state.streak;
}

// --- ナビ ---
function renderNav(){
  const nav=el("catnav");
  const items=[["mix","🎯 特訓"],["judge","🃏 何切る"],["know","🧠 暗記"],["chart","📊 表"],["stats","📈 成績"]];
  nav.innerHTML=items.map(([k,v])=>`<button class="cat ${state.mode===k?"active":""}" data-m="${k}">${v}</button>`).join("");
  nav.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
    state.mode=b.dataset.m; renderNav();
    if(state.mode==="chart") renderChartView();
    else if(state.mode==="stats") renderStatsView();
    else nextItem();
  });
}

// ===== 進捗の永続化(対応環境ではlocalStorageに自動保存) =====
const SAVE_KEY="poker-dojo-v1";
function storageOK(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } }
const CAN_SAVE=storageOK();
function itemKey(it){ return it.type==="judge" ? "j:"+it.ref.title : "k:"+it.ref.q; }
function saveState(){
  if(!CAN_SAVE) return;
  try{
    const boxes={};
    ITEMS.forEach(it=>{ if(it.box>1) boxes[itemKey(it)]=it.box; });
    localStorage.setItem(SAVE_KEY, JSON.stringify({r:state.rating,x:state.xp,a:state.answered,c:state.counts,b:boxes}));
  }catch(e){}
}
function loadState(){
  if(!CAN_SAVE) return;
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(!d) return;
    if(typeof d.r==="number") state.rating=d.r;
    if(typeof d.x==="number") state.xp=d.x;
    if(typeof d.a==="number") state.answered=d.a;
    if(d.c) state.counts=d.c;
    if(d.b) ITEMS.forEach(it=>{ const v=d.b[itemKey(it)]; if(v>=1&&v<=5) it.box=v; });
  }catch(e){}
}
function resetSave(){ if(CAN_SAVE){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} } location.reload(); }
loadState();

renderNav(); renderChips(); nextItem();

</script>
<script>
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
